<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alberto González, diseñador de producto</title>
<!-- /es/ es la dirección corta del sitio en español: lleva a la portada con ?lang=es (sitio estático, sin reglas de servidor).
     Guarda la elección en localStorage para que el selector EN | ES y las visitas siguientes sigan en español. -->
<link rel="canonical" href="https://agonzalez.viciusstudio.cl/?lang=es">
<meta http-equiv="refresh" content="0; url=../?lang=es">
<meta name="theme-color" content="#000000">
<script>
try { localStorage.setItem('site-lang', 'es'); } catch (e) {}
location.replace('../?lang=es' + location.hash);
</script>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;
  background:#000;color:#e6e9ee;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#00e5ff}
</style>
</head>
<body>
<p>Abriendo el sitio en español. Si no se abre solo, <a href="../?lang=es">entra aquí</a>.</p>
</body>
</html>
